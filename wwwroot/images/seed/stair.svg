<defs>
  <radialGradient id="bg" cx="50%" cy="34%" r="72%">
    <stop offset="0%" stop-color="#6a4a30"/>
    <stop offset="42%" stop-color="#2c1f16"/>
    <stop offset="100%" stop-color="#100e0c"/>
  </radialGradient>
  <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
