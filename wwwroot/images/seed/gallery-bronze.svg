<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" viewBox="0 0 800 1000">
<defs>
  <radialGradient id="bg" cx="50%" cy="34%" r="72%">
    <stop offset="0%" stop-color="#6a4a30"/>
    <stop offset="42%" stop-color="#2c1f16"/>
    <stop offset="100%" stop-color="#100e0c"/>
  </radialGradient>
  <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#f7ecd8"/>
    <stop offset="40%" stop-color="#d4b07a"/>
    <stop offset="68%" stop-color="#8a5a32"/>
    <stop offset="100%" stop-color="#f3ddb8"/>
  </linearGradient>
  <linearGradient id="crystal" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#fffaf3"/>
    <stop offset="100%" stop-color="#c9dbe3" stop-opacity="0.45"/>
  </linearGradient>
  <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="14"/>
  </filter>
  <filter id="grain">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
  </filter>
</defs>
<rect width="800" height="1000" fill="url(#bg)"/>
<rect width="800" height="1000" filter="url(#grain)" opacity="0.28"/>
<rect x="40" y="40" width="720" height="920" fill="none" stroke="#e7d3ae" stroke-opacity="0.28"/>
<path d="M150 760 H650" stroke="#e7d3ae" stroke-opacity="0.35"/>
<path d="M230 470 H310 L300 700 H240 Z" fill="url(#metal)"/>
<path d="M360 390 H470 L450 430 H380 Z" fill="url(#metal)"/>
<path d="M350 440 Q415 360 480 440 L500 680 Q415 760 330 680 Z" fill="url(#metal)"/>
<path d="M520 520 H610 L598 700 H532 Z" fill="url(#metal)"/>
</svg>
